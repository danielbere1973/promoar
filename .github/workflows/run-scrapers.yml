name: Run Scheduled Scrapers

on:
  # schedule DESACTIVADO temporalmente a pedido del usuario (17/09)
  # schedule:
  #   - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      scraper_id:
        description: 'ID del scraper a ejecutar (vacío = todos los programados)'
        required: false

env:
  PLAYWRIGHT_SCRAPERS: "amex,cabal,changomas,banco galicia,icbc,banco macro,naranjax,banco santander,banco supervielle,banco ciudad,visa,banco del sol"

jobs:
  check:
    runs-on: ubuntu-latest
    name: Determinar scrapers pendientes
    outputs:
      http_scrapers: ${{ steps.compute.outputs.http_scrapers }}
      playwright_scrapers: ${{ steps.compute.outputs.playwright_scrapers }}
    steps:
      - name: Determinar scrapers HTTP y Playwright a ejecutar
        id: compute
        run: |
          if [ -n "${{ github.event.inputs.scraper_id }}" ]; then
            INPUT="${{ github.event.inputs.scraper_id }}"
            HTTP=""
            PW=""
            IFS=',' read -ra LIST <<< "$INPUT"
            for S in "${LIST[@]}"; do
              S=$(echo "$S" | xargs)
              if echo "$PLAYWRIGHT_SCRAPERS" | grep -qi "$S"; then
                PW="${PW}${PW:+,}${S}"
              else
                HTTP="${HTTP}${HTTP:+,}${S}"
                PW="${PW}${PW:+,}${S}"
              fi
            done
            echo "http_scrapers=$HTTP" >> $GITHUB_OUTPUT
            echo "playwright_scrapers=$PW" >> $GITHUB_OUTPUT
          else
            RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.VTEX_SESSION_SECRET }}" "${{ secrets.API_URL }}/api/internal/scrapers-due")
            ALL=$(echo $RESPONSE | python3 -c "import sys,json; print(','.join(json.load(sys.stdin)['scrapers']))" 2>/dev/null || echo "")
            HTTP=""
            PW=""
            IFS=',' read -ra LIST <<< "$ALL"
            for S in "${LIST[@]}"; do
              if echo "$PLAYWRIGHT_SCRAPERS" | grep -qi "$S"; then
                PW="${PW}${PW:+,}${S}"
              else
                HTTP="${HTTP}${HTTP:+,}${S}"
              fi
            done
            echo "http_scrapers=$HTTP" >> $GITHUB_OUTPUT
            echo "playwright_scrapers=$PW" >> $GITHUB_OUTPUT
          fi

  prepare-matrix:
    needs: check
    runs-on: ubuntu-latest
    name: Preparar matrices
    outputs:
      http_matrix: ${{ steps.build.outputs.http_matrix }}
      playwright_matrix: ${{ steps.build.outputs.playwright_matrix }}
    steps:
      - name: Convertir listas a JSON para matrix
        id: build
        run: |
          python3 -c "
          import json, os
          http = '${{ needs.check.outputs.http_scrapers }}'
          pw = '${{ needs.check.outputs.playwright_scrapers }}'
          http_list = [s.strip() for s in http.split(',') if s.strip()]
          pw_list = [s.strip() for s in pw.split(',') if s.strip()]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'http_matrix={json.dumps(http_list)}\n')
              f.write(f'playwright_matrix={json.dumps(pw_list)}\n')
          "

  run-http:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.http_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scraper: ${{ fromJson(needs.prepare-matrix.outputs.http_matrix) }}
    name: Scraper HTTP (${{ matrix.scraper }})
    steps:
      - name: Ejecutar scraper HTTP
        run: |
          echo "Ejecutando HTTP: ${{ matrix.scraper }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.VTEX_SESSION_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"scraperId\":\"${{ matrix.scraper }}\"}" \
            "${{ secrets.API_URL }}/api/internal/run-scraper"
          echo ""

  run-playwright:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.playwright_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scraper: ${{ fromJson(needs.prepare-matrix.outputs.playwright_matrix) }}
    name: Scraper Playwright (${{ matrix.scraper }})
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: playwright-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Ejecutar scraper Playwright
        shell: bash
        env:
          API_URL: ${{ secrets.API_URL }}
          VTEX_SESSION_SECRET: ${{ secrets.VTEX_SESSION_SECRET }}
          SCRAPING_BROWSER_WS: ${{ secrets.SCRAPING_BROWSER_WS }}
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          echo "Ejecutando Playwright: ${{ matrix.scraper }}"
          npx tsx scripts/run-playwright-scraper.ts "${{ matrix.scraper }}"

  auto-validate:
    needs: [check, run-http, run-playwright]
    if: always() && (needs.run-http.result == 'success' || needs.run-http.result == 'failure' || needs.run-playwright.result == 'success' || needs.run-playwright.result == 'failure')
    runs-on: ubuntu-latest
    name: Auto-validar DRAFTs
    steps:
      - name: Ejecutar auto-validador
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.VTEX_SESSION_SECRET }}" \
            "${{ secrets.API_URL }}/api/admin/auto-validate"
          echo ""
